<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Item - Campus Cart</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase App, Firestore, Auth, and Storage SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div class="app-screen">
        <!-- Top Bar -->
        <header class="header">
            <div class="user-greeting">
                <h2>Post an Item</h2>
                <p>List your item for campus buyers</p>
            </div>
        </header>

        <!-- Scrollable Form Container -->
        <div class="app-content">
            <div class="form-container">
                <div class="input-group">
                    <label>Item Name</label>
                    <input type="text" id="itemName" placeholder="e.g., Scientific Calculator">
                </div>

                <div class="input-group">
                    <label>Category</label>
                    <select id="itemCategory">
                        <option>Phones</option>
                        <option>Textbooks</option>
                        <option>Electronics</option>
                        <option>Hostel Gear</option>
                        <option>Services</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Price (UGX)</label>
                    <input type="text" id="itemPrice" placeholder="e.g., 200,000">
                </div>

                <div class="input-group">
                    <label>Description & Condition</label>
                    <textarea id="itemDescription" rows="4" placeholder="Briefly describe the item..."></textarea>
                </div>

                <div class="input-group">
                    <label>Product Image</label>
                    <input type="file" id="itemImage" accept="image/*">
                </div>

                <button class="action-btn" id="publishBtn">Publish Listing</button>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                <span>Home</span>
            </a>
            <a href="post.html" class="nav-item active">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                <span>Sell</span>
            </a>
            <a href="profile.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <!-- Firebase Storage & Form Handler Script -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjH10VN2Bq4moC3f9o8DEq9tjC3CnoxFA",
            authDomain: "campus-cart-f3c69.firebaseapp.com",
            projectId: "campus-cart-f3c69",
            storageBucket: "campus-cart-f3c69.firebasestorage.app",
            messagingSenderId: "672137009166",
            appId: "1:672137009166:web:27dfca3ba9488e3bc7445f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        document.getElementById('publishBtn').addEventListener('click', async (e) => {
            e.preventDefault();

            const itemName = document.getElementById('itemName').value;
            const category = document.getElementById('itemCategory').value;
            const price = document.getElementById('itemPrice').value;
            const description = document.getElementById('itemDescription').value;
            const imageFile = document.getElementById('itemImage').files[0];

            if(!itemName || !price) {
                alert('Please fill in the item name and price.');
                return;
            }

            document.getElementById('publishBtn').innerText = "Uploading...";

            try {
                let imageUrl = "";

                // 1. Upload image to Firebase Storage if selected
                if (imageFile) {
                    const storageRef = storage.ref(`listings/${Date.now()}_${imageFile.name}`);
                    const snapshot = await storageRef.put(imageFile);
                    imageUrl = await snapshot.ref.getDownloadURL();
                }

                // 2. Save complete listing details to Firestore
                await db.collection("listings").add({
                    title: itemName,
                    category: category,
                    price: price,
                    description: description,
                    imageUrl: imageUrl,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('Listing published successfully!');
                window.location.href = 'index.html';

            } catch (error) {
                console.error("Error publishing listing:", error);
                alert('Failed to publish item. Check console.');
                document.getElementById('publishBtn').innerText = "Publish Listing";
            }
        });
    </script>
</body>
</html>
