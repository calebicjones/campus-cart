<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Cart - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-screen center-screen">
        <div class="auth-box">
            <h2>Campus Cart</h2>
            <p>YMCA Buwambo Campus</p>

            <form id="authForm">
                <div class="input-group">
                    <input type="text" id="usernameInput" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <input type="password" id="passwordInput" placeholder="Password" required>
                </div>
                <div class="input-group">
                    <input type="tel" id="phoneInput" placeholder="Phone Number (for WhatsApp)" required>
                </div>
                <div class="input-group">
                    <label>Profile Picture</label>
                    <input type="file" id="profilePicInput" accept="image/*">
                </div>

                <button type="submit" class="action-btn">Sign In / Register</button>
            </form>
            
            <div class="auth-footer">
                <a href="index.html">Skip to Home Feed</a>
            </div>
        </div>
    </div>

</body>
</html>
