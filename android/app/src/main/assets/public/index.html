<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Cart - YMCA Buwambo</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase App (Core) and Firestore SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="app-screen">
        <!-- Top Bar -->
        <header class="header">
            <div class="user-greeting">
                <h2>Hi, Caleb</h2>
                <p>What would you like to find today?</p>
            </div>
            <div class="header-action">
                <a href="post.html" class="post-item-btn">Post Item</a>
            </div>
        </header>

        <!-- Scrollable Content Area -->
        <div class="app-content">
            <!-- Search Bar -->
            <div class="search-box">
                <input type="text" placeholder="Search for phones, textbooks, gear...">
            </div>

            <!-- Banner Section -->
            <div class="promo-banner">
                <div class="banner-text">
                    <h3>Campus Cart Hub</h3>
                    <p>Trade securely with fellow students on campus.</p>
                </div>
            </div>

            <!-- Categories Section -->
            <section class="section">
                <h3>Categories</h3>
                <div class="categories-grid">
                    <div class="cat-card"><span>Phones</span></div>
                    <div class="cat-card"><span>Textbooks</span></div>
                    <div class="cat-card"><span>Electronics</span></div>
                    <div class="cat-card"><span>Hostel Gear</span></div>
                    <div class="cat-card"><span>Services</span></div>
                </div>
            </section>

            <!-- Recent Listings Section -->
            <section class="section">
                <div class="section-header">
                    <h3>Recent Listings</h3>
                    <span class="see-all">See All</span>
                </div>
                
                <!-- Dynamic Products Grid where live data will load -->
                <div class="products-grid" id="listingsContainer">
                    <!-- Live Firestore listings will inject here automatically -->
                    <p style="font-size: 13px; color: #666;">Loading live campus listings...</p>
                </div>
            </section>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                <span>Home</span>
            </a>
            <a href="post.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                <span>Sell</span>
            </a>
            <a href="profile.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <!-- Firebase Real-time Feed Listener Script -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjH10VN2Bq4moC3f9o8DEq9tjC3CnoxFA",
            authDomain: "campus-cart-f3c69.firebaseapp.com",
            projectId: "campus-cart-f3c69",
            storageBucket: "campus-cart-f3c69.firebasestorage.app",
            messagingSenderId: "672137009166",
            appId: "1:672137009166:web:27dfca3ba9488e3bc7445f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const container = document.getElementById('listingsContainer');

        // Real-time listener for listings collection
        db.collection("listings").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            container.innerHTML = ""; // Clear loading state

            if (snapshot.empty) {
                container.innerHTML = "<p style='font-size: 13px; color: #666;'>No items listed yet. Be the first to sell!</p>";
                return;
            }

            snapshot.forEach((doc) => {
                const item = doc.data();
                
                // Use uploaded image if available, otherwise show a placeholder block
                const imageContent = item.imageUrl 
                    ? `<img src="${item.imageUrl}" style="width: 100%; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 8px;" />` 
                    : `<div class="product-img placeholder-img"></div>`;

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    ${imageContent}
                    <h4>${item.title}</h4>
                    <p class="price">UGX ${item.price}</p>
                    <button class="whatsapp-btn" onclick="alert('Opening WhatsApp chat for: ${item.title}')">Chat on WhatsApp</button>
                `;
                container.appendChild(card);
            });
        });

        // Make category cards interactive
        document.querySelectorAll('.cat-card').forEach(card => {
            card.addEventListener('click', () => {
                const categoryName = card.querySelector('span').innerText;
                alert('Filtering listings for: ' + categoryName);
            });
        });
    </script>
</body>
</html>
